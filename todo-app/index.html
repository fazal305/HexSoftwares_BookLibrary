<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A responsive to-do list app with localStorage persistence, task completion, counters, and clear completed actions."
    />
    <title>HexSoftwares To-Do App | Task Planner</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="canonical" href="https://fazal305.github.io/hexsoftwares-todo-app/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fazal305.github.io/hexsoftwares-todo-app/" />
    <meta property="og:title" content="HexSoftwares To-Do App | Task Planner" />
    <meta
      property="og:description"
      content="A simple to-do list app built with HTML, CSS, and JavaScript for the HexSoftwares internship."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HexSoftwares To-Do App | Task Planner" />
    <meta
      name="twitter:description"
      content="A simple to-do list app built with HTML, CSS, and JavaScript for the HexSoftwares internship."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-container">
      <section class="todo-card" aria-labelledby="app-title">
        <header class="app-header">
          <p class="eyebrow">HexSoftwares Internship Project</p>
          <h1 class="app-title" id="app-title">Task Planner</h1>
          <p class="app-subtitle">
            Add tasks, track progress, and keep your list saved in the browser.
          </p>
        </header>

        <section class="input-section" aria-label="Add a task">
          <div class="input-row">
            <label class="sr-only" for="task-input">Task name</label>
            <input
              type="text"
              id="task-input"
              placeholder="Enter a task..."
              autocomplete="off"
            />
            <button id="add-btn" type="button">Add Task</button>
          </div>

          <p id="validation-message" class="validation-message">
            Please enter a task.
          </p>

          <div class="task-info">
            <p id="task-counter" class="task-counter">0 tasks remaining</p>
            <button
              id="clear-completed-btn"
              class="clear-completed-btn"
              type="button"
            >
              Clear completed
            </button>
          </div>
        </section>

        <div id="empty-state" class="empty-state">
          <p>No tasks yet. Add one above to get started.</p>
        </div>

        <div id="task-list" class="task-list" aria-label="Task list"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
